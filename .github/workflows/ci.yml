name: Backend CI
# feature → main PR을 검증한다. check·gitleaks는 main 브랜치 보호의 필수 체크다
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# 같은 PR에 새 push가 오면 이전 런을 취소한다. main push 런은 진행 중이어도 취소하지 않는다 —
# 머지 커밋마다 런이 끝까지 남아야 그 커밋의 검증 기록이 된다 (automation/pipeline.md Step 2)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: make lint
      # 문법·import·타입 참조·JSON·계약 견본 동기화 (scripts/check_scaffold.py)
      - run: make check
      # tests/ 전체: API(tests/api/)·검색·코퍼스(tests/test_*.py)·비전 평가(tests/evals/)·ship 스크립트(tests/automation/)
      # ·마이그레이션 파일 규칙(tests/migrations/, DB 동작 검사는 MIGRATION_TEST_DATABASE_URL이 없어 건너뜀)
      - run: make test

  # 커밋 이력에 API 키 등 시크릿이 섞이지 않았는지 검사한다
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks scan
        uses: docker://ghcr.io/gitleaks/gitleaks:latest
        with:
          args: detect --source=. --redact -v
