[project]
name = "ok-muncheol-be"
version = "0.1.0"
description = "OK문철 A–D 담당별 계약·모듈 초안"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
]

# 비전·PDF·임베딩 의존성은 API 런타임과 분리한다.

[project.optional-dependencies]
ingestion = ["pdfplumber>=0.11,<0.12"]
embedding = ["openai>=1,<4", "python-dotenv>=1,<2", "tiktoken>=0.7,<1"]
evaluation = ["numpy>=1.26,<3"]
# 검증 도구 — make lint(ruff)·make test(pytest). CI check 잡이 같은 것을 설치한다(.github/workflows/ci.yml)
dev = [
    "pytest>=8",
    "pdfplumber>=0.11,<0.12",
    "openai>=1,<4",
    "numpy>=1.26,<3",
    "python-dotenv>=1,<2",
    "tiktoken>=0.7,<1",
    "ruff>=0.6",
]
# 비전 평가(evals/vision/): AI Hub 설명서 코드표 추출·키프레임·VLM 호출. API 런타임에는 넣지 않는다
vision-eval = [
    "anthropic>=1",
    "numpy>=2",
    "openai>=1",
    "opencv-python-headless>=4.10",
    "pdfplumber>=0.11",
    "ultralytics>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
