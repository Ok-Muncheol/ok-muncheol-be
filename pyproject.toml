[project]
name = "ok-muncheol-be"
version = "0.1.0"
description = "OK문철 A–D 담당별 계약·모듈 초안"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
]

# Pydantic·LangGraph·DB는 부트스트랩에서 추가한다. 런타임 의존성은 여기 한 곳에 적고 requirements.txt는 `.`로 가리킨다.
# 비전·PDF·임베딩 의존성은 API 런타임과 분리한다.

[project.optional-dependencies]
# 검증 도구 — make lint(ruff)·make test(pytest). CI check 잡이 같은 것을 설치한다(.github/workflows/ci.yml)
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
